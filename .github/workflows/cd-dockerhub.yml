name: Product API CD - Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/productdb
        run: |
          nohup node app.js > app.log 2>&1 &
          sleep 5

      - name: Check API health
        run: |
          curl --fail http://localhost:3000/

      - name: Test CRUD
        run: |
          curl --fail -X POST http://localhost:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":101,"pname":"Laptop ASUS Vivobook","price":18500000,"quantity":12}'

          curl --fail http://localhost:3000/products

          curl --fail http://localhost:3000/products/101

          curl --fail -X PUT http://localhost:3000/products/101 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Laptop ASUS Vivobook Pro","price":20000000,"quantity":15}'

          curl --fail -X DELETE http://localhost:3000/products/101

      - name: Build Docker image
        run: |
          docker build -t dinhkhanh3314/product-api:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push dinhkhanh3314/product-api:latest

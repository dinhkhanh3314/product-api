name: Product API Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/productdb
        run: |
          nohup node app.js > app.log 2>&1 &
          sleep 5

      - name: Check API
        run: |
          curl --fail http://localhost:3000/

      - name: Test CREATE product
        run: |
          curl --fail -X POST http://localhost:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":101,"pname":"Laptop ASUS Vivobook","price":18500000,"quantity":12}'

      - name: Test READ products
        run: |
          curl --fail http://localhost:3000/products

      - name: Test READ product by pid
        run: |
          curl --fail http://localhost:3000/products/101

      - name: Test UPDATE product
        run: |
          curl --fail -X PUT http://localhost:3000/products/101 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Laptop ASUS Vivobook Pro","price":20000000,"quantity":15}'

      - name: Test DELETE product
        run: |
          curl --fail -X DELETE http://localhost:3000/products/101

      - name: Verify DELETE
        run: |
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/products/101 | grep -q "404"; then
            echo "DELETE test passed"
          else
            echo "DELETE test failed"
            exit 1
          fi
